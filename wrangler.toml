name = "piece-selector"
compatibility_date = "2026-09-01"
main = "./src/server/worker.ts"

[secrets]
required = [ "AUTH_PASSWORD_HASH", "SESSION_SIGNING_KEY" ]

[assets]
directory = "./dist/"
binding = "ASSETS"
run_worker_first = [ "/api/*" ]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "piece-selector"
database_id = "eccdeb30-3d58-43f6-b931-6f146b58976b"
migrations_dir = "./migrations"

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
